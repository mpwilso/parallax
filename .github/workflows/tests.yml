name: tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# a newer push to a branch cancels its older run. Each push to master gets a group of its own, keyed
# by its commit, so no master run is cancelled or replaced. With one group for master, a merge pushed
# while a run was going replaced the pending run of the merge before it: run 42151952768, at 6a0ef22,
# was cancelled before it started when 2d23dce's run queued
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    # twice, side by side: from the checkout, and from a second clone at a path with a space in it, so
    # no test depends on where the repo lives (four once failed in a scratch copy). Neither stops the other
    name: tests from ${{ matrix.where }}
    # a pull request from this repo already ran on its push, so only one from a fork runs again here
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        where: [the checkout, a second clone]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the token stays out of .git/config; nothing here pushes
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: The sandbox, for the three tests that need it
        # Ubuntu 24.04 blocks the unprivileged user namespaces bubblewrap needs; the runner can allow them.
        # If the sandbox still can't start, those tests skip and -rs prints why.
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # pinned to one release, like the actions above, so a new publish can't change this run on its own
          npm install -g @anthropic-ai/sandbox-runtime@0.0.79
      - name: The agent SDK, from the claude extra's pinned range, has every name the adapter uses. No model call.
        if: matrix.where == 'the checkout'
        run: uv run --no-project --python 3.12 --with-editable ".[claude]" python scripts/sdk_names.py
      - name: A Python uv downloaded, which a plain uv venv would prefer, so the venv test has one to avoid
        # field-demo task 70d1f6: a venv on uv's own Python, under $HOME, which the tests' sandbox can't read
        run: uv python install --no-bin 3.13   # into uv's own folder only, not onto PATH, as on the machine 70d1f6 ran on
      - name: Chromium for the browser tests, the version scripts/test.sh pins
        run: scripts/test.sh browser
      - name: Lint and the full suite, browser tests included, as scripts/test.sh runs them. No test calls a model.
        if: matrix.where == 'the checkout'
        run: scripts/test.sh
        env:
          PARALLAX_BROWSER_TRACES: browser-traces   # each failed browser test leaves a Playwright trace and its console log here
      - name: The same suite from a second clone, at a path with a space in it
        if: matrix.where == 'a second clone'
        run: |
          second="$RUNNER_TEMP/second clone/px"
          git clone --quiet --no-checkout "$GITHUB_WORKSPACE" "$second"
          git -C "$second" checkout --quiet --detach "$GITHUB_SHA"
          cd "$second" && scripts/test.sh
        env:
          PARALLAX_BROWSER_TRACES: ${{ github.workspace }}/browser-traces
      - name: Traces and console logs of failed browser tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-traces from ${{ matrix.where }}
          path: browser-traces/
          if-no-files-found: ignore
