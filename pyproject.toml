[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax"
version = "0.3.1"
description = "Agents do the work. You make the calls."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
parallax = "parallax.cli:main"

[project.optional-dependencies]
dev = ["pytest"]
claude = ["claude-agent-sdk>=0.2.179,<0.3"]  # the series the adapter is tested on; CI checks its names (scripts/sdk_names.py)

[tool.setuptools]
packages = ["parallax", "parallax.agents"]

[tool.setuptools.package-data]
parallax = ["web/*"]

[tool.ruff]
line-length = 130
exclude = ["docs/tasks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # ruff's default rules, pinned so CI doesn't move with ruff

[tool.pytest.ini_options]
testpaths = ["tests"]  # Parallax's tests; docs/tasks holds tasks' files, never collected
