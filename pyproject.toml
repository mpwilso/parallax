[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax"
version = "0.1.0"
description = "Agents do the work. You make the calls."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
parallax = "parallax.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["parallax"]
