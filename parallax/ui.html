<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>parallax</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e4e4df;
  --accent: #2f5bea; --accent-ink: #ffffff; --soft: #eef1fd;
  --good: #1f7a3d; --good-bg: #e6f4ea; --bad: #b3261e; --bad-bg: #fce8e6; --warn: #8a5a00; --warn-bg: #fff4d6;
  --add: #e6f4ea; --add-ink: #145c2c; --del: #fce8e6; --del-ink: #8c1d18; --hunk: #eef1fd;
  --mono: ui-monospace, "Cascadia Code", Consolas, "SF Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141414; --panel: #1c1c1c; --ink: #ececea; --muted: #9a9a94; --line: #2e2e2c;
    --accent: #7c9cff; --accent-ink: #0d0d0d; --soft: #1f2540;
    --good: #7fd18f; --good-bg: #16301e; --bad: #ff8a80; --bad-bg: #3a1a18; --warn: #f2c25b; --warn-bg: #33290f;
    --add: #16301e; --add-ink: #a6e3b4; --del: #3a1a18; --del-ink: #ffb4ab; --hunk: #1f2540;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); display: flex; flex-direction: column; }
button { font: inherit; cursor: pointer; }
code, pre { font-family: var(--mono); font-size: 13px; }

header { display: flex; align-items: center; gap: 16px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
header .brand { font-weight: 650; letter-spacing: .2px; }
header .project { color: var(--muted); }
header .count { margin-left: 4px; padding: 2px 10px; border-radius: 999px; background: var(--soft); color: var(--accent); font-weight: 600; font-size: 13px; }
header .count.zero { background: transparent; color: var(--muted); font-weight: 400; }
nav { display: flex; gap: 4px; margin-left: 12px; }
nav button { border: 0; background: none; color: var(--muted); padding: 6px 12px; border-radius: 8px; }
nav button.on { background: var(--soft); color: var(--accent); font-weight: 600; }
header .spacer { flex: 1; }
.linkish { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 5px 12px; border-radius: 8px; font-size: 13px; }

#banner { display: none; padding: 10px 18px; background: var(--bad-bg); color: var(--bad); border-bottom: 1px solid var(--line); }
#banner.show { display: block; }

main { flex: 1; display: grid; grid-template-columns: minmax(280px, 380px) 1fr; min-height: 0; }
#list { border-right: 1px solid var(--line); overflow: auto; background: var(--panel); }
#detail { overflow: auto; padding: 22px 28px 120px; }

.group { padding: 14px 16px 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
.row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 16px; border-left: 3px solid transparent; cursor: pointer; }
.row:hover { background: var(--bg); }
.row.sel { background: var(--soft); border-left-color: var(--accent); }
.row input { margin-top: 4px; }
.row .text { flex: 1; min-width: 0; }
.row .head { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block; }
.chip { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.chip.ready, .chip.good { background: var(--good-bg); color: var(--good); border-color: transparent; }
.chip.disputed, .chip.stuck, .chip.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.chip.running, .chip.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }

.empty { color: var(--muted); padding: 60px 20px; text-align: center; }
.empty .big { font-size: 20px; color: var(--ink); margin-bottom: 6px; }

h1 { font-size: 20px; margin: 0 0 4px; font-weight: 650; }
.sub { color: var(--muted); margin-bottom: 18px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 22px 0 8px; font-weight: 600; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.card + .card { margin-top: 8px; }
ul.plain { margin: 0; padding-left: 18px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; }
.kv .k { color: var(--muted); }
.note { color: var(--muted); font-size: 13px; }
.waiting { display: inline-flex; gap: 8px; align-items: center; background: var(--warn-bg); color: var(--warn); padding: 4px 10px; border-radius: 8px; font-size: 13px; }

.diff { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: auto; }
.diff pre { margin: 0; padding: 8px 0; }
.diff .l { display: block; padding: 0 14px; white-space: pre; }
.diff .add { background: var(--add); color: var(--add-ink); }
.diff .del { background: var(--del); color: var(--del-ink); }
.diff .hunk { background: var(--hunk); color: var(--muted); }
.diff .file { font-weight: 700; padding-top: 6px; }
.diff .meta { color: var(--muted); }

.decide { position: sticky; bottom: 0; margin-top: 26px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
.decide textarea { width: 100%; min-height: 58px; resize: vertical; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.decide textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.decide .btns { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.decide .hint { color: var(--muted); font-size: 12px; margin-left: auto; }
.yes, .no { border: 1px solid transparent; padding: 8px 16px; border-radius: 8px; font-weight: 600; }
.yes { background: var(--accent); color: var(--accent-ink); }
.no { background: var(--panel); color: var(--ink); border-color: var(--line); }
.yes:disabled, .no:disabled { opacity: .4; cursor: not-allowed; }

.result { margin-top: 14px; }
.result .card.good { border-color: transparent; background: var(--good-bg); color: var(--good); }
.result .card.bad { border-color: transparent; background: var(--bad-bg); color: var(--bad); }
.result pre { white-space: pre-wrap; margin: 8px 0 0; color: var(--ink); }

table.tasks { width: 100%; border-collapse: collapse; }
table.tasks td, table.tasks th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.tasks th { font-size: 12px; color: var(--muted); font-weight: 600; }
table.tasks tr.click { cursor: pointer; }
table.tasks tr.click:hover { background: var(--bg); }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 90px 1fr; gap: 12px; padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.timeline .when { color: var(--muted); font-size: 12px; padding-top: 2px; }
.copy { display: flex; gap: 8px; align-items: center; }
.copy code { background: var(--bg); border: 1px solid var(--line); padding: 6px 10px; border-radius: 8px; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; padding: 0 4px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <span class="brand">parallax</span>
  <span class="project" id="project"></span>
  <span class="count zero" id="count">loading</span>
  <nav>
    <button id="tab-inbox" class="on">Inbox</button>
    <button id="tab-tasks">Tasks</button>
  </nav>
  <span class="spacer"></span>
  <button class="linkish" id="notify">Turn on notifications</button>
</header>
<div id="banner"></div>
<main>
  <section id="list" aria-label="items"></section>
  <section id="detail" aria-live="polite"></section>
</main>
<script>
"use strict";
const TOKEN = location.hash.slice(1);
const state = { tab: "inbox", data: null, selected: null, checked: new Set(), task: null, draft: "", seen: null, result: null };

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid.nodeType ? kid : String(kid));
  return n;
}
function ago(ts) {
  if (!ts) return "";
  const s = Math.max(0, (Date.now() - Date.parse(ts)) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago";
  return Math.floor(s / 86400) + " d ago";
}
function money(x) { return x ? "$" + x.toFixed(2) : ""; }

async function api(path, opts) {
  const res = await fetch(path, { ...(opts || {}), headers: { "X-Parallax-Token": TOKEN, "Content-Type": "application/json" } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error || res.statusText), { status: res.status });
  return body;
}

function banner(text) {
  const b = document.getElementById("banner");
  b.textContent = text || "";
  b.classList.toggle("show", !!text);
}

// ---------- inbox ----------
function items() { return state.data ? state.data.inbox.groups.flatMap(g => g.items) : []; }
function find(id) { return items().find(i => i.id === id); }

function renderList() {
  const list = document.getElementById("list");
  list.replaceChildren();
  if (state.tab === "tasks") return renderTaskList(list);
  const groups = state.data.inbox.groups;
  if (!groups.length) {
    list.append(el("div", { class: "empty" }, el("div", { class: "big" }, "Nothing waiting on you."), "New items show up here on their own."));
    return;
  }
  for (const g of groups) {
    list.append(el("div", { class: "group", title: g.title }, g.title.length > 60 ? g.title.slice(0, 57) + "..." : g.title));
    for (const it of g.items) {
      const box = el("input", { type: "checkbox", title: "select to decide several at once", onclick: e => { e.stopPropagation(); toggle(it); } });
      box.checked = state.checked.has(it.id);
      list.append(el("div", { class: "row" + (state.selected === it.id ? " sel" : ""), onclick: () => select(it.id), "data-id": it.id },
        box,
        el("div", { class: "text" },
          el("div", { class: "head" }, it.headline),
          el("div", { class: "meta" },
            it.context.waiting ? el("span", { class: "dot", title: "an agent is waiting on this" }) : null,
            el("span", { class: "chip" }, it.kind_name), ago(it.ts)))));
    }
  }
}

function toggle(it) {
  const first = [...state.checked].map(find).find(Boolean);
  if (state.checked.has(it.id)) state.checked.delete(it.id);
  else {
    if (first && first.kind !== it.kind) { state.checked.clear(); }
    state.checked.add(it.id);
  }
  render();
}
function select(id) { state.selected = id; state.result = null; render(); }

function section(title, ...body) { return [el("h2", {}, title), ...body]; }
function diffView(text) {
  if (!text) return el("div", { class: "note" }, "No changes yet.");
  const pre = el("pre");
  for (const line of text.split("\n")) {
    let cls = "l";
    if (line.startsWith("diff --git")) cls += " file";
    else if (line.startsWith("+++") || line.startsWith("---") || line.startsWith("index ") || line.startsWith("new file")) cls += " meta";
    else if (line.startsWith("@@")) cls += " hunk";
    else if (line.startsWith("+")) cls += " add";
    else if (line.startsWith("-")) cls += " del";
    pre.append(el("span", { class: cls }, line || " "));
  }
  return el("div", { class: "diff" }, pre);
}

function context(it) {
  const c = it.context, out = [];
  if (c.goal) out.push(...section("The task", el("div", { class: "card" }, c.goal)));
  switch (it.kind) {
    case "decision.requested":
      out.push(...section("What it wants to do", el("div", { class: "card kv" },
        el("span", { class: "k" }, "action"), el("code", {}, c.action),
        el("span", { class: "k" }, "target"), el("code", {}, c.detail || c.key))));
      if (c.waiting) out.push(el("p", {}, el("span", { class: "waiting" }, el("span", { class: "dot" }), "The agent is paused until you decide.")));
      break;
    case "disagreement.raised":
      if (c.stage === "guard") out.push(...section("What happened", el("div", { class: "card" }, c.why)));
      else out.push(...section("What the checker found", el("div", { class: "card" },
        c.findings && c.findings.length ? el("ul", { class: "plain" }, c.findings.map(f => el("li", {}, f))) : c.why)));
      if (c.plan) out.push(...section("The plan", el("div", { class: "card" }, el("pre", { style: "white-space:pre-wrap;margin:0" }, c.plan))));
      if (c.diff !== undefined) out.push(...section("The change", diffView(c.diff)));
      if (c.maker_summary) out.push(...section("What the maker said", el("div", { class: "card" }, c.maker_summary),
        el("p", { class: "note" }, "The checker never saw this. Only you do.")));
      break;
    case "stuck.raised":
      out.push(...section("Why it stopped", el("div", { class: "card" }, c.why)));
      if (c.refusals && c.refusals.length) out.push(...section("What kept getting refused", el("div", { class: "card" },
        el("ul", { class: "plain" }, c.refusals.map(r => el("li", {}, el("code", {}, r.action + " " + r.detail), r.why ? "  (" + r.why + ")" : ""))))));
      break;
  }
  return out;
}

function decideBar(targets) {
  const [yesText, noText] = targets[0].choices;
  const area = el("textarea", { id: "reason", placeholder: "Your reason (every decision needs one)", oninput: e => { state.draft = e.target.value; sync(); } });
  area.value = state.draft;
  const yes = el("button", { class: "yes", onclick: () => decide(targets, true) }, yesText + (targets.length > 1 ? ` (${targets.length})` : ""));
  const no = el("button", { class: "no", onclick: () => decide(targets, false) }, noText + (targets.length > 1 ? ` (${targets.length})` : ""));
  function sync() { yes.disabled = no.disabled = !area.value.trim(); }
  sync();
  return el("div", { class: "decide" }, area, el("div", { class: "btns" }, yes, no,
    el("span", { class: "hint" }, el("kbd", {}, "j"), " ", el("kbd", {}, "k"), " move, ", el("kbd", {}, "/"), " reason")));
}

async function decide(targets, approve) {
  const reason = state.draft.trim();
  if (!reason) return;
  try {
    const res = await api("/api/resolve", { method: "POST", body: JSON.stringify({ ids: targets.map(t => t.id), approve, reason }) });
    const names = Object.fromEntries(targets.map(t => [t.id, t.headline]));
    state.result = res.results.map(r => ({ ...r, headline: names[r.id], choice: approve ? targets[0].choices[0] : targets[0].choices[1] }));
    state.draft = "";
    state.checked.clear();
    await refresh(true);
    const next = items()[0];
    state.selected = next ? next.id : null;
    render();
  } catch (err) { state.result = [{ ok: false, error: err.message }]; render(); }
}

function resultView() {
  if (!state.result) return null;
  return el("div", { class: "result", style: "margin:0 0 18px" }, state.result.map(r => r.ok
    ? el("div", { class: "card good" }, (r.choice ? `You chose ${r.choice} for: ` : "Done: ") + (r.headline || r.id) + ".")
    : el("div", { class: "card bad" }, (r.headline ? r.headline + ": " : "") + r.error)));
}

function renderInboxDetail(d) {
  const picked = [...state.checked].map(find).filter(Boolean);
  if (picked.length > 1) {
    d.append(...[el("h1", {}, `${picked.length} ${picked[0].kind_name} items`), el("div", { class: "sub" }, "One reason covers all of them."),
      el("div", { class: "card" }, el("ul", { class: "plain" }, picked.map(p => el("li", {}, p.headline)))), resultView(), decideBar(picked)].filter(Boolean));
    return;
  }
  const it = find(state.selected);
  if (!it) {
    d.append(resultView() || "", el("div", { class: "empty" },
      el("div", { class: "big" }, items().length ? "Pick an item on the left." : "Nothing waiting on you."),
      items().length ? "Everything you need to decide is on its page." : "Agents are working, or idle. New items appear here on their own."));
    return;
  }
  d.append(...[resultView(), el("h1", {}, it.headline),
    el("div", { class: "sub" }, it.kind_name + (it.task ? " on task " + it.task : "") + ", " + ago(it.ts)),
    ...context(it), decideBar([it])].filter(Boolean));
}

// ---------- tasks ----------
function renderTaskList(list) {
  const tasks = state.data.tasks;
  if (!tasks.length) { list.append(el("div", { class: "empty" }, el("div", { class: "big" }, "No tasks yet."), 'Start one with: parallax task new "..."')); return; }
  const table = el("table", { class: "tasks" }, el("tr", {}, el("th", {}, "task"), el("th", {}, "status"), el("th", {}, "cost")));
  for (const t of tasks) table.append(el("tr", { class: "click" + (state.task === t.id ? " sel" : ""), onclick: () => { state.task = t.id; render(); } },
    el("td", {}, el("div", {}, t.goal.length > 70 ? t.goal.slice(0, 67) + "..." : t.goal), el("div", { class: "note" }, t.id + ", " + ago(t.last))),
    el("td", {}, el("span", { class: "chip " + t.status.replace(" ", "-") }, t.status)), el("td", {}, money(t.cost_usd))));
  list.append(table);
}

async function renderTaskDetail(d) {
  if (!state.task) { d.append(el("div", { class: "empty" }, el("div", { class: "big" }, "Pick a task on the left."), "You'll see its timeline and its change.")); return; }
  let t;
  try { t = await api("/api/task/" + state.task); } catch (err) { d.append(el("div", { class: "card bad" }, err.message)); return; }
  if (state.tab !== "tasks" || state.task !== t.id) return;  // the view moved on while this loaded
  d.replaceChildren(...[el("h1", {}, t.goal.split("\n")[0]),
    el("div", { class: "sub" }, el("span", { class: "chip " + t.status.replace(" ", "-") }, t.status), "  task " + t.id,
      t.cost_usd ? ", " + money(t.cost_usd) : ""),
    t.merge ? el("div", { class: "card" }, el("div", {}, "Merging is your call. When you're happy with it, run this in your repo's folder:"),
      el("div", { class: "copy", style: "margin-top:8px;align-items:flex-start" }, el("pre", { style: "margin:0;white-space:pre-wrap;flex:1" }, el("code", {}, t.merge)),
        el("button", { class: "linkish", onclick: e => { navigator.clipboard.writeText(t.merge); e.target.textContent = "Copied"; } }, "Copy"))) : null,
    ...section("The change", diffView(t.diff)),
    ...section("Timeline", el("ul", { class: "timeline" }, t.timeline.map(e => el("li", {}, el("span", { class: "when" }, ago(e.ts)), el("span", {}, e.text))))),
  ].filter(Boolean));
}

// ---------- shell ----------
function render() {
  document.getElementById("tab-inbox").classList.toggle("on", state.tab === "inbox");
  document.getElementById("tab-tasks").classList.toggle("on", state.tab === "tasks");
  if (!state.data) return;
  const n = state.data.inbox.count;
  const count = document.getElementById("count");
  count.textContent = n ? `${n} waiting on you` : "nothing waiting on you";
  count.classList.toggle("zero", !n);
  document.title = (n ? `(${n}) ` : "") + "parallax";
  document.getElementById("project").textContent = state.data.project;
  renderList();
  const d = document.getElementById("detail");
  const keep = document.activeElement && document.activeElement.id === "reason";
  d.replaceChildren();
  if (state.tab === "inbox") renderInboxDetail(d); else renderTaskDetail(d);
  if (keep) { const r = document.getElementById("reason"); if (r) { r.focus(); r.setSelectionRange(r.value.length, r.value.length); } }
}

function notifyNew() {
  const waiting = items().filter(i => i.kind === "decision.requested" && i.context.waiting);
  const ids = new Set(items().map(i => i.id));
  if (state.seen && "Notification" in window && Notification.permission === "granted") {
    for (const i of waiting) if (!state.seen.has(i.id)) new Notification("parallax: an agent is waiting on you", { body: i.headline, tag: i.id });
  }
  state.seen = ids;
}

async function refresh(quiet) {
  const data = await api("/api/state");
  state.data = data;
  if (state.selected && !find(state.selected)) state.selected = null;
  if (!state.selected && items().length && !quiet) state.selected = items()[0].id;
  for (const id of [...state.checked]) if (!find(id)) state.checked.delete(id);
  notifyNew();
}

let version = null;
async function poll() {
  try {
    const v = (await api("/api/version")).version;
    banner("");
    if (v !== version) {
      const typing = document.activeElement && document.activeElement.id === "reason";
      version = v;
      await refresh();
      if (!typing || state.tab !== "inbox") render(); else { renderList(); }
    }
  } catch (err) {
    banner(err.status === 401 ? "This page needs the link printed by `parallax ui`. Open that link instead."
      : "parallax ui stopped. Run `parallax ui` again in your repo's folder, then use the new link.");
  }
}

document.getElementById("tab-inbox").onclick = () => { state.tab = "inbox"; render(); };
document.getElementById("tab-tasks").onclick = () => { state.tab = "tasks"; render(); };
const notifyBtn = document.getElementById("notify");
function syncNotify() {
  if (!("Notification" in window)) { notifyBtn.remove(); return; }
  if (Notification.permission === "granted") notifyBtn.textContent = "Notifications on";
  if (Notification.permission === "denied") notifyBtn.textContent = "Notifications blocked";
}
notifyBtn.onclick = async () => { await Notification.requestPermission(); syncNotify(); };
syncNotify();

document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT" || state.tab !== "inbox") return;
  const all = items(), i = all.findIndex(x => x.id === state.selected);
  if ((e.key === "j" || e.key === "ArrowDown") && all.length) { select(all[Math.min(all.length - 1, i + 1)].id); e.preventDefault(); }
  if ((e.key === "k" || e.key === "ArrowUp") && all.length) { select(all[Math.max(0, i - 1)].id); e.preventDefault(); }
  if (e.key === "/") { const r = document.getElementById("reason"); if (r) { r.focus(); e.preventDefault(); } }
});

if (!TOKEN) banner("This page needs the link printed by `parallax ui`. Open that link instead.");
else { poll(); setInterval(poll, 2000); }
