<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Parallax</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="top">
  <h1><span id="logo" class="logo" aria-hidden="true"></span><span class="word">parallax</span><span class="sep" aria-hidden="true">/</span><span id="project"></span> <span id="count" class="count" hidden></span></h1>
  <form id="intake" autocomplete="off">
    <label for="work" class="vh">Describe the work</label>
    <input id="work" name="work" placeholder="Describe the work, then press Enter" enterkeyhint="send">
  </form>
</header>
<p id="status" class="status" role="status" aria-live="polite"></p>
<p id="offline" class="offline" role="alert" hidden>Parallax isn't answering: the <code>parallax ui</code> server has stopped. Start it again with <code>parallax ui</code> in a terminal, then reload this page.</p>
<div id="tools" class="offline tools" role="alert" hidden></div>
<main id="app">
  <nav id="queue" aria-label="Tasks"></nav>
  <article id="card" aria-labelledby="card-title" hidden></article>
  <section id="idle" class="idle" aria-label="Overview" hidden></section>
</main>
<p id="locked" class="locked" hidden>This page needs its link. Run <code>parallax ui</code> and open the link it prints; it stays the same between runs, so you can bookmark it.</p>
</body>
</html>
