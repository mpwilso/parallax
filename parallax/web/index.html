<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Parallax</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="top">
  <h1><span id="project">parallax</span> <span id="count" class="count" hidden></span></h1>
  <form id="intake" autocomplete="off">
    <label for="work" class="vh">Describe the work</label>
    <input id="work" name="work" placeholder="Describe the work, then press Enter" enterkeyhint="send">
  </form>
</header>
<p id="status" class="status" role="status" aria-live="polite"></p>
<p id="offline" class="offline" role="alert" hidden>Can't reach <code>parallax ui</code>. Is it still running? Trying again.</p>
<main id="app">
  <nav id="queue" aria-label="Tasks"></nav>
  <article id="card" aria-labelledby="card-title" hidden></article>
  <p id="idle" class="idle" hidden></p>
</main>
<p id="locked" class="locked" hidden>This page needs its link. Run <code>parallax ui</code> and open the link it prints; it stays the same between runs, so you can bookmark it.</p>
</body>
</html>
